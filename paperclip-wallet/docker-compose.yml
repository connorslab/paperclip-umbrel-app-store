{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "paperclip-wallet_wallet_1",
        "APP_PORT": "3000"
      }
    },
    "wallet": {
      "image": "ghcr.io/connorslab/paperclip-wallet-app:beta-bundled-37224320419@sha256:5d34da097510d08ab5c0d41622dd1483d554cea38b286ff603737404241fe829",
      "user": "1000:1000",
      "restart": "unless-stopped",
      "stop_grace_period": "2m",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "environment": {
        "APP_PASSWORD": "${APP_PASSWORD}",
        "PAPERCLIP_XBT_MAINNET": "1",
        "BARKD_UI_DEFAULT_ARK_SERVER": "https://ark.paperclippool.xyz"
      }
    }
  }
}
