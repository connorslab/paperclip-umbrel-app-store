{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "paperclip-wallet_wallet_1",
        "APP_PORT": "3000"
      }
    },
    "wallet": {
      "image": "ghcr.io/connorslab/paperclip-wallet-app:beta-36796846848@sha256:e7e7d46513f1816e6df1484b5bf65c8fac14abc170e22bebde9bcd999d7574f1",
      "user": "1000:1000",
      "restart": "unless-stopped",
      "stop_grace_period": "2m",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "environment": {
        "APP_PASSWORD": "${APP_PASSWORD}",
        "PAPERCLIP_XBT_MAINNET": "1",
        "BARKD_UI_DEFAULT_ARK_SERVER": "https://ark.paperclippool.xyz"
      }
    }
  }
}
