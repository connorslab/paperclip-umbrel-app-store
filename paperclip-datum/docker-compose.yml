services:
  app_proxy:
    environment:
      APP_HOST: paperclip-datum_gateway_1
      APP_PORT: 7152
  gateway:
    image: ghcr.io/connorslab/convoy-datum:0.2.0@sha256:78f0d8c525e5cae8079327339ae0d2f9e82d1fcb7b84f75ba5f397c40c573424
    user: "1000:1000"
    restart: unless-stopped
    environment:
      RPC_URL: http://${APP_PAPERCLIP_KNOTS_RPC_HOST}:${APP_PAPERCLIP_KNOTS_RPC_PORT}
      RPC_USER: ${APP_PAPERCLIP_KNOTS_RPC_USER}
      RPC_PASSWORD: ${APP_PAPERCLIP_KNOTS_RPC_PASS}
      ADMIN_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports:
      - "23334:23334"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
