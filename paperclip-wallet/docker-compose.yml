{
  "services": {
    "app_proxy": {
      "environment": {
        "APP_HOST": "paperclip-wallet_wallet_1",
        "APP_PORT": "3000"
      }
    },
    "wallet": {
      "image": "ghcr.io/connorslab/paperclip-wallet-app:beta-41126306588@sha256:5da1bc86c801af9d61af2af9f0f6f501a51f36963885c2eaf8d652f0fe183877",
      "user": "1000:1000",
      "restart": "unless-stopped",
      "stop_grace_period": "2m",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "environment": {
        "APP_PASSWORD": "${APP_PASSWORD}",
        "PAPERCLIP_XBT_MAINNET": "1",
        "BARKD_UI_DEFAULT_ARK_SERVER": "https://ark.paperclippool.xyz",
        "PAPERCLIP_NODE_RPC_URL": "http://${APP_BITCOIN_NODE_IP:-}:${APP_BITCOIN_RPC_PORT:-}",
        "PAPERCLIP_NODE_RPC_USER": "${APP_BITCOIN_RPC_USER:-}",
        "PAPERCLIP_NODE_RPC_PASSWORD": "${APP_BITCOIN_RPC_PASS:-}"
      }
    }
  }
}
